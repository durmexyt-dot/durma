<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GIFs verwalten</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 48px; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    a { color: #8cf; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1; min-width: 0; padding: 12px; font-size: 16px; border-radius: 8px;
      border: 1px solid #333; background: #1c1c1c; color: #eee;
    }
    button {
      padding: 12px 18px; font-size: 16px; border: 0; border-radius: 8px; cursor: pointer;
      background: #3a7bfd; color: #fff; white-space: nowrap;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { background: #2a2a2a; }
    #status { min-height: 1.4em; margin: 0 0 16px; font-size: 14px; }
    #status.error { color: #ff7b7b; }
    #status.ok { color: #7bdc8f; }
    details { margin-bottom: 24px; background: #1a1a1a; border-radius: 8px; padding: 12px; }
    summary { cursor: pointer; }
    details p { font-size: 13px; color: #aaa; line-height: 1.5; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li { display: flex; align-items: center; gap: 12px; background: #1a1a1a; border-radius: 8px; padding: 8px; }
    li img { width: 96px; height: 64px; object-fit: cover; border-radius: 6px; background: #000; flex: none; }
    li span { flex: 1; min-width: 0; font-size: 12px; color: #aaa; overflow-wrap: anywhere; }
    li button { background: #c0392b; padding: 8px 12px; font-size: 14px; }
    .empty { color: #777; font-size: 14px; }
    li.added { outline: 1px solid #3a7bfd; }
    li.added span::before { content: 'NEU · '; color: #8cf; font-weight: 600; }
    #pushBar {
      position: sticky; bottom: 16px; margin-top: 20px; display: flex; align-items: center; gap: 8px;
      padding: 12px; border-radius: 10px; background: #1f2a3d; box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
    }
    #pushBar[hidden] { display: none; }
    #pushInfo { flex: 1; font-size: 14px; }
    #push { background: #2ea44f; }
  </style>
</head>
<body>
<main>
  <h1>GIFs verwalten · <a href="../">Ansehen</a></h1>

  <details id="tokenBox">
    <summary>GitHub-Token</summary>
    <p>
      Wird nur in diesem Browser gespeichert und nur an api.github.com geschickt.
      Benötigt einen Fine-grained Token für <b>durmexyt-dot/durma</b> mit
      <b>Contents: Read and write</b>
      (<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">hier erstellen</a>).
    </p>
    <div class="row">
      <input id="token" type="password" placeholder="github_pat_11XXXXXXXXXXXXXXXXXXXX_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX" autocomplete="off">
      <button id="saveToken" class="ghost">Speichern</button>
    </div>
  </details>

  <label for="url">GIF-Link (GIPHY-Seite oder direkter .gif-Link)</label>
  <div class="row">
    <input id="url" type="url" placeholder="https://giphy.com/gifs/…" autocomplete="off">
    <button id="create">Create</button>
  </div>
  <p id="status"></p>

  <ul id="list"></ul>

  <div id="pushBar" hidden>
    <span id="pushInfo"></span>
    <button id="discard" class="ghost">Verwerfen</button>
    <button id="push">Push</button>
  </div>
</main>

<script type="module">
  import { sharePage, PREVIEW_W, PREVIEW_H } from './share-page.js';

  const OWNER = 'durmexyt-dot', REPO = 'durma', BRANCH = 'dev', PATH = 'gifs/gifs.json';
  const REPO_API = `https://api.github.com/repos/${OWNER}/${REPO}`;

  const $ = id => document.getElementById(id);
  const tokenInput = $('token'), urlInput = $('url'), createBtn = $('create'), listEl = $('list'), statusEl = $('status');

  // published = Stand im Repo, draft = lokale Änderungen, die erst mit „Push“ hochgeladen werden
  let published = [];
  let draft = [];
  let missingPreviews = 0;

  function load(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }

  // Entwurf überlebt Neuladen der Seite
  function saveDraft() {
    try {
      if (same(draft, published)) localStorage.removeItem('gif_draft');
      else localStorage.setItem('gif_draft', JSON.stringify(draft));
    } catch (e) {}
  }
  function loadDraft() { try { return JSON.parse(localStorage.getItem('gif_draft')); } catch (e) { return null; } }
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  function setStatus(text, kind = '') { statusEl.textContent = text; statusEl.className = kind; }

  const src = name => /^https?:\/\//.test(name) ? name : '../gifs/' + name;

  // GIPHY-Seitenlinks (giphy.com/gifs/titel-ID) in den direkten GIF-Link umwandeln
  function normalize(input) {
    let url;
    try { url = new URL(input.trim()); } catch (e) { return null; }
    if (/(^|\.)giphy\.com$/.test(url.hostname)) {
      const m = url.pathname.match(/\/(?:gifs|media|embed)\/(?:[^/]*-)?([A-Za-z0-9]+)(?:\/|$)/);
      if (m) return `https://media.giphy.com/media/${m[1]}/giphy.gif`;
    }
    return url.href;
  }

  function headers() {
    const h = { Accept: 'application/vnd.github+json' };
    const t = tokenInput.value.trim();
    if (t) h.Authorization = 'Bearer ' + t;
    return h;
  }

  function decode(b64) {
    const bytes = Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function render() {
    const added = draft.filter(g => !published.includes(g)).length;
    const removed = published.filter(g => !draft.includes(g)).length;
    $('pushBar').hidden = !added && !removed && !missingPreviews;
    $('pushInfo').textContent = added || removed
      ? [added && `${added} neu`, removed && `${removed} entfernt`].filter(Boolean).join(', ') + ' – noch nicht gepusht'
      : (missingPreviews > 1 ? `${missingPreviews} Vorschaubilder für Link-Vorschau fehlen` : '1 Vorschaubild für Link-Vorschau fehlt') + ' – Push erzeugt sie';

    listEl.innerHTML = '';
    if (!draft.length) {
      listEl.innerHTML = '<li class="empty">Noch keine GIFs in der Liste.</li>';
      return;
    }
    draft.forEach((g, i) => {
      const li = document.createElement('li');
      if (!published.includes(g)) li.className = 'added';
      const img = document.createElement('img');
      img.src = src(g); img.alt = ''; img.loading = 'lazy';
      const span = document.createElement('span');
      span.textContent = (i + 1) + '. ' + g;
      const del = document.createElement('button');
      del.textContent = 'Entfernen';
      del.addEventListener('click', () => { draft = draft.filter(x => x !== g); saveDraft(); render(); setStatus(''); });
      li.append(img, span, del);
      listEl.append(li);
    });
  }

  async function api(path, options = {}) {
    const r = await fetch(REPO_API + path, {
      ...options,
      cache: 'no-store',
      headers: { ...headers(), ...(options.body ? { 'Content-Type': 'application/json' } : {}) }
    });
    if (r.status === 401) throw new Error('Token ungültig.');
    if (r.status === 404 && !options.method) throw new Error(tokenInput.value.trim() ? 'Kein Zugriff – hat der Token Rechte auf das Repo?' : 'Bitte zuerst den GitHub-Token eintragen.');
    if (r.status === 403 || r.status === 404) throw new Error('Keine Schreibrechte – Token braucht „Contents: Read and write“.');
    return r;
  }
  const json = async r => { if (!r.ok) throw new Error('GitHub-Fehler ' + r.status); return r.json(); };

  // Erstes Bild des GIFs als JPEG (schwarzer Rand, 1200×630) – base64 ohne Präfix, oder null wenn es nicht geht
  function makePreview(gif) {
    return new Promise(resolve => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = PREVIEW_W; c.height = PREVIEW_H;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
          const scale = Math.min(c.width / img.naturalWidth, c.height / img.naturalHeight);
          const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
          ctx.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
          resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
        } catch (e) { resolve(null); } // Server erlaubt kein CORS → Bild nicht auslesbar
      };
      img.onerror = () => resolve(null);
      img.src = src(gif);
    });
  }

  // Alle Dateipfade im Repo zu einem Commit
  async function repoPaths(commitSha) {
    const treeSha = (await json(await api(`/git/commits/${commitSha}`))).tree.sha;
    const tree = await json(await api(`/git/trees/${treeSha}?recursive=1`));
    return { treeSha, paths: new Set(tree.tree.map(e => e.path)) };
  }

  // Aktuellen Stand direkt aus dem Repo laden (ohne Pages-Cache)
  async function fetchList(ref = BRANCH) {
    const data = await json(await api(`/contents/${PATH}?ref=${ref}`));
    return JSON.parse(decode(data.content));
  }

  // Alle Änderungen des Entwurfs in einem Commit ins Repo schreiben; bei Konflikt neu laden und nochmal versuchen
  async function push() {
    if (!tokenInput.value.trim()) { $('tokenBox').open = true; setStatus('Bitte zuerst den GitHub-Token eintragen.', 'error'); return; }
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    setStatus('Pushe …');
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        // Liste und alle Vorschauseiten (1/, 2/, …) in einem einzigen Commit schreiben
        const head = (await json(await api(`/git/ref/heads/${BRANCH}`))).object.sha;
        // Falls die Liste inzwischen woanders geändert wurde: nur die eigenen Änderungen darauf anwenden
        const remote = await fetchList(head);
        const added = draft.filter(g => !published.includes(g));
        const removed = new Set(published.filter(g => !draft.includes(g)));
        const next = remote.filter(g => !removed.has(g)).concat(added.filter(g => !remote.includes(g)));
        const { treeSha: baseTree, paths } = await repoPaths(head);
        const file = (path, content) => ({ path, mode: '100644', type: 'blob', content });
        const remove = path => ({ path, mode: '100644', type: 'blob', sha: null });
        const tree = [file(PATH, JSON.stringify(next, null, 2) + '\n')];

        for (let i = 0; i < next.length; i++) {
          const n = i + 1, previewPath = `${n}/preview.jpg`;
          // Vorschaubild nur neu erzeugen, wenn an dieser Stelle ein anderes GIF steht oder es fehlt
          let hasPreview = paths.has(previewPath) && remote[i] === next[i];
          if (!hasPreview) {
            setStatus(`Erzeuge Vorschaubild ${n} / ${next.length} …`);
            const jpeg = await makePreview(next[i]);
            if (jpeg) {
              const blob = await json(await api('/git/blobs', { method: 'POST', body: JSON.stringify({ content: jpeg, encoding: 'base64' }) }));
              tree.push({ path: previewPath, mode: '100644', type: 'blob', sha: blob.sha });
              hasPreview = true;
            } else if (paths.has(previewPath)) {
              tree.push(remove(previewPath)); // veraltetes Bild eines anderen GIFs
            }
          }
          tree.push(file(`${n}/index.html`, sharePage(n, next[i], hasPreview)));
        }
        // Seiten hinter dem Listenende löschen
        for (const path of paths) {
          const m = path.match(/^([0-9]+)\/(index\.html|preview\.jpg)$/);
          if (m && +m[1] > next.length) tree.push(remove(path));
        }
        setStatus('Pushe …');
        const newTree = await json(await api('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: baseTree, tree }) }));
        const commit = await json(await api('/git/commits', { method: 'POST', body: JSON.stringify({
          message: `Update GIFs (+${added.length} / -${removed.size})`, tree: newTree.sha, parents: [head]
        }) }));
        // Ohne force: schlägt fehl, wenn jemand anderes inzwischen gepusht hat → nochmal versuchen
        const r = await api(`/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
        if (r.status === 409 || r.status === 422) continue;
        await json(r);
        published = next;
        draft = next.slice();
        missingPreviews = 0;
        saveDraft();
        render();
        setStatus('Gepusht. Auf der Seite sichtbar in ca. 1 Minute.', 'ok');
        return;
      }
      throw new Error('Konflikt beim Pushen – bitte nochmal versuchen.');
    } catch (e) {
      setStatus(e.message, 'error');
    } finally {
      document.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  createBtn.addEventListener('click', () => {
    const url = normalize(urlInput.value);
    if (!url) { setStatus('Das ist kein gültiger Link.', 'error'); return; }
    if (draft.includes(url)) { setStatus('Dieses GIF ist schon in der Liste.', 'error'); return; }
    draft.push(url);
    saveDraft();
    render();
    urlInput.value = '';
    setStatus('Hinzugefügt – mit „Push“ veröffentlichen.', 'ok');
  });
  $('push').addEventListener('click', push);
  $('discard').addEventListener('click', () => { draft = published.slice(); saveDraft(); render(); setStatus('Änderungen verworfen.'); });
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') createBtn.click(); });

  $('saveToken').addEventListener('click', async () => {
    try { localStorage.setItem('gh_token', tokenInput.value.trim()); } catch (e) {}
    $('tokenBox').open = false;
    await init();
  });

  async function init() {
    setStatus('Lade …');
    try {
      published = await fetchList();
      const head = (await json(await api(`/git/ref/heads/${BRANCH}`))).object.sha;
      const { paths } = await repoPaths(head);
      missingPreviews = published.filter((g, i) => !paths.has(`${i + 1}/preview.jpg`)).length;
      setStatus('');
    } catch (e) {
      // Ohne Token: öffentliche Liste der Seite anzeigen
      try { published = await (await fetch('../gifs/gifs.json', { cache: 'no-cache' })).json(); } catch (_) { published = []; }
      if (!tokenInput.value.trim()) $('tokenBox').open = true;
      setStatus(e.message, 'error');
    }
    draft = loadDraft() || published.slice();
    render();
  }

  tokenInput.value = load('gh_token');
  init();
</script>
</body>
</html>
